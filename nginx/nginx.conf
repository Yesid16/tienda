log_format upstream_log '$remote_addr "$request" -> $status | backend: $upstream_addr';

upstream django_v1 {
    server web:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream_log;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA NUEVA: la compra se "estrangula" hacia Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
    }

    # RUTA VIEJA: sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }

    # Todo lo demás sigue en Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }
}